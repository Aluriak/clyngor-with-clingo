# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      clingo_version: ${{ steps.strip.outputs.version }}
      package_version: ${{ steps.strip.outputs.package_version }}
    steps:
      - id: strip
        # The package version always equals the clingo version it ships, so
        # the tag names both: v5.8.0 -> clingo 5.8.0. A re-release of the
        # same clingo keeps that equality by adding a PEP 440 post segment
        # (v5.8.0.post1, like the older 5.3.post0), which conda-forge knows
        # nothing about -- so drop it to get the version to fetch.
        run: |
          set -e
          package="${GITHUB_REF_NAME#v}"
          clingo=$(printf '%s' "$package" | grep -oE '^[0-9]+\.[0-9]+(\.[0-9]+)?')
          echo "package $package ships clingo $clingo"
          echo "package_version=$package" >> "$GITHUB_OUTPUT"
          echo "version=$clingo" >> "$GITHUB_OUTPUT"

  build-binaries:
    needs: version
    uses: ./.github/workflows/build-binaries.yml
    with:
      clingo_version: ${{ needs.version.outputs.clingo_version }}

  release-build:
    runs-on: ubuntu-latest
    needs:
      - version
      - build-binaries

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check the tag against the packaged version
        # setup.cfg carries the version and the tag is typed by hand, so
        # they can disagree -- and PyPI would accept whatever was built,
        # under a number nobody meant to release.
        run: |
          set -e
          declared=$(python -c "import configparser; c=configparser.ConfigParser(); c.read('setup.cfg'); print(c['metadata']['version'])")
          tagged="${{ needs.version.outputs.package_version }}"
          echo "setup.cfg: $declared, tag: $tagged"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match setup.cfg version ($declared)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: clingo-binaries-linux
          path: artifacts/linux/

      - uses: actions/download-artifact@v4
        with:
          name: clingo-binaries-macos-arm64
          path: artifacts/macos-arm64/

      - uses: actions/download-artifact@v4
        with:
          name: clingo-binaries-macos-x64
          path: artifacts/macos-x64/

      - uses: actions/download-artifact@v4
        with:
          name: clingo-binaries-win
          path: artifacts/win/

      - name: Build one wheel per platform
        # One platform-tagged wheel each, instead of a single fat wheel:
        # each stays well under PyPI's 100 MB per-file limit, and users
        # only download binaries for their own OS. The size check on each
        # binary is the regression guard for the v5.4.0 incident (empty
        # placeholder binaries published to PyPI, see issue #5). No sdist:
        # a source install would have no binaries at all.
        run: |
          set -e
          python -m pip install build
          declare -A plat=(
            [linux]=manylinux2014_x86_64
            [macos-arm64]=macosx_11_0_arm64
            [macos-x64]=macosx_10_13_x86_64
            [win]=win_amd64
          )
          for p in linux macos-arm64 macos-x64 win; do
            rm -rf clyngor_with_clingo/bin
            mkdir -p "clyngor_with_clingo/bin/$p"
            cp -r "artifacts/$p/." "clyngor_with_clingo/bin/$p/"
            exe="clyngor_with_clingo/bin/$p/clingo"
            [ "$p" = win ] && exe="$exe.exe"
            chmod +x "$exe"
            size=$(stat -c%s "$exe")
            echo "$exe: $size bytes"
            if [ "$size" -lt 100000 ]; then
              echo "::error::$exe is only $size bytes, refusing to publish a broken binary"
              exit 1
            fi
            cp setup.cfg setup.cfg.orig
            printf '\n[bdist_wheel]\nplat_name = %s\n' "${plat[$p]}" >> setup.cfg
            python -m build --wheel
            mv setup.cfg.orig setup.cfg
          done
          ls -lh dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/p/clyngor-with-clingo

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
