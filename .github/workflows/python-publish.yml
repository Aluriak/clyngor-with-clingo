# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      clingo_version: ${{ steps.strip.outputs.version }}
    steps:
      - id: strip
        # strip the leading 'v' from the tag (v5.8.0 -> 5.8.0), matching the
        # convention that the package version always equals the clingo version.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-binaries:
    needs: version
    uses: ./.github/workflows/build-binaries.yml
    with:
      clingo_version: ${{ needs.version.outputs.clingo_version }}

  release-build:
    runs-on: ubuntu-latest
    needs:
      - build-binaries

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v4
        with:
          name: clingo-binaries-linux
          path: clyngor_with_clingo/bin/linux/

      - uses: actions/download-artifact@v4
        with:
          name: clingo-binaries-macos
          path: clyngor_with_clingo/bin/macos/

      - uses: actions/download-artifact@v4
        with:
          name: clingo-binaries-win
          path: clyngor_with_clingo/bin/win/

      - name: Fail if any binary is missing or suspiciously small
        # Regression guard: this is exactly what let empty placeholder
        # binaries get published as v5.4.0 (see issue #5).
        run: |
          set -e
          chmod +x clyngor_with_clingo/bin/linux/clingo clyngor_with_clingo/bin/macos/clingo
          for f in clyngor_with_clingo/bin/linux/clingo \
                   clyngor_with_clingo/bin/macos/clingo \
                   clyngor_with_clingo/bin/win/clingo.exe; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 100000 ]; then
              echo "::error::$f is only $size bytes, refusing to publish a broken binary"
              exit 1
            fi
          done

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/p/clyngor-with-clingo

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
